openapi: 3.0.3
info:
  title: FormForge API
  version: 0.1.0
  description: >
    Hosted form backend for static sites. Public submissions go to /f/{id};
    owners manage forms, submissions, webhooks and billing through /api.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Submissions
  - name: Forms
  - name: Webhooks
  - name: Billing

paths:
  /f/{id}:
    post:
      tags: [Submissions]
      summary: Submit a form (public)
      description: >
        Accepts form-encoded or JSON bodies. Checks honeypot, then reCAPTCHA
        (if enabled on the form), then the monthly quota. Spam is stored with
        is_spam = true. If a _redirect field is present and is an http(s) URL,
        responds with 303 to that URL.
      security: []
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Submission saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '303':
          description: Redirect to the _redirect URL
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/forms:
    get:
      tags: [Forms]
      summary: List my forms
      responses:
        '200':
          description: Forms owned by the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Form' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Forms]
      summary: Create a form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormInput' }
      responses:
        '201':
          description: Form created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Form' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/forms/{id}:
    patch:
      tags: [Forms]
      summary: Update form settings
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormInput' }
      responses:
        '200':
          description: Updated form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Form' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Forms]
      summary: Delete a form
      parameters:
        - $ref: '#/components/parameters/FormId'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/forms/{id}/submissions:
    get:
      tags: [Forms]
      summary: List submissions (paginated)
      parameters:
        - $ref: '#/components/parameters/FormId'
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: include_spam, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Submission' }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/forms/{id}/export.csv:
    get:
      tags: [Forms]
      summary: Download submissions as CSV
      parameters:
        - $ref: '#/components/parameters/FormId'
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/forms/{id}/webhooks:
    post:
      tags: [Webhooks]
      summary: Add a webhook to a form
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_url]
              properties:
                target_url: { type: string, format: uri }
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Remove a webhook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/billing/checkout:
    post:
      tags: [Billing]
      summary: Start Stripe Checkout
      responses:
        '200':
          description: Checkout session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/billing/stripe-webhook:
    post:
      tags: [Billing]
      summary: Receive Stripe events
      description: Verified with the Stripe-Signature header, not a user session.
      security: []
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Event received }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    supabaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase session access token.
  parameters:
    FormId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Form:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        name: { type: string }
        notify_email: { type: string, format: email, nullable: true }
        webhook_url: { type: string, format: uri, nullable: true }
        recaptcha_on: { type: boolean }
        allowed_domain: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    FormInput:
      type: object
      properties:
        name: { type: string }
        notify_email: { type: string, format: email }
        recaptcha_on: { type: boolean }
        allowed_domain: { type: string }
    Submission:
      type: object
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string, format: uuid }
        data: { type: object, additionalProperties: true }
        is_spam: { type: boolean }
        created_at: { type: string, format: date-time }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string, format: uuid }
        target_url: { type: string, format: uri }
        active: { type: boolean }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed (not the owner, domain not allowed, or spam blocked)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit or monthly quota exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - supabaseAuth: []
